<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Stacked bar of sluice gate condition" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="660" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">Sluice gates in two Satkhira divisions</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">216 gates built on canals in the 1960s and 1970s</text><line x1="60" y1="576" x2="1140" y2="576" stroke="#11261f" stroke-width="2"/><text x="60" y="612" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Bangladesh Water Development Board, as given in this story. Remainder calculated.</text><text x="60" y="250" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">216 in total</text><rect x="60.0" y="275" width="310.0" height="90" fill="#f1521d"/><rect x="370.0" y="275" width="250.0" height="90" fill="#11261f"/><rect x="620.0" y="275" width="520.0" height="90" fill="#57b6ae"/><rect x="60" y="410" width="22" height="22" fill="#f1521d"/><text x="96" y="430" font-size="21" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Completely defunct: 62 (28.7%)</text><rect x="620" y="410" width="22" height="22" fill="#11261f"/><text x="656" y="430" font-size="21" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Lost drainage capacity (another): 50 (23.1%)</text><rect x="60" y="454" width="22" height="22" fill="#57b6ae"/><text x="96" y="474" font-size="21" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Other gates (remainder): 104 (48.1%)</text></svg>