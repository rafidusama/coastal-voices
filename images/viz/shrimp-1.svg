<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 458" width="1200" height="458" role="img" aria-label="Bar chart of profit by method" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="458" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">Liakat's yearly profit on one acre and 15 decimals</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Taka. Cluster method versus the traditional method.</text><line x1="60" y1="374" x2="1140" y2="374" stroke="#11261f" stroke-width="2"/><text x="60" y="410" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Md. Liakat, Utkul village, Bagerhat, as told in this story</text><text x="60" y="249" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Cluster method (more than)</text><rect x="440" y="215" width="458.3" height="46" fill="#f1521d"/><text x="912.3333333333333" y="249" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">300,000 taka</text><text x="60" y="323" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Traditional (less than)</text><rect x="440" y="289" width="152.8" height="46" fill="#57b6ae"/><text x="606.7777777777778" y="323" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">100,000 taka</text></svg>