<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" aria-label="Bar chart of changes in fuel security" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="532" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">What changed for cooking fuel</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Share of survey respondents</text><line x1="60" y1="448" x2="1140" y2="448" stroke="#11261f" stroke-width="2"/><text x="60" y="484" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Alston, Women and Climate Change in Bangladesh (2015), tables 7.4 and text</text><text x="60" y="249" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Less fuel available</text><rect x="490" y="215" width="450.0" height="46" fill="#f1521d"/><text x="954.0" y="249" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">90%</text><text x="60" y="323" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Need to find new sources</text><rect x="490" y="289" width="365.0" height="46" fill="#57b6ae"/><text x="869.0" y="323" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">73%</text><text x="60" y="397" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">More time to collect fuel</text><rect x="490" y="363" width="180.0" height="46" fill="#57b6ae"/><text x="684.0" y="397" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">36%</text></svg>