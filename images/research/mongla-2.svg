<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" aria-label="Bar chart of residents who said a green buffer exists" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="532" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">Said a strategic green buffer exists</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">40 coastal residents interviewed, by zone</text><line x1="60" y1="448" x2="1140" y2="448" stroke="#11261f" stroke-width="2"/><text x="60" y="484" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Islam and Islam, Bangladesh Meteorological Department wind records</text><text x="60" y="249" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Western zone (9 people)</text><rect x="490" y="215" width="500.0" height="46" fill="#57b6ae"/><text x="1004.0" y="249" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">100%</text><text x="60" y="323" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Eastern zone (12 people)</text><rect x="490" y="289" width="375.0" height="46" fill="#57b6ae"/><text x="879.0" y="323" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">75%</text><text x="60" y="397" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Central zone (19 people)</text><rect x="490" y="363" width="185.0" height="46" fill="#f1521d"/><text x="689.0" y="397" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">37%</text></svg>