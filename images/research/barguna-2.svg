<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 458" width="1200" height="458" role="img" aria-label="Bar chart of people per doctor" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="458" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">People for every doctor</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Barguna district</text><line x1="60" y1="374" x2="1140" y2="374" stroke="#11261f" stroke-width="2"/><text x="60" y="410" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Rezwana, Disasters, Gender and Access to Healthcare (2018), citing Health Bulletins 2013 and 2014</text><text x="60" y="249" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">If every post were filled</text><rect x="440" y="215" width="128.7" height="46" fill="#57b6ae"/><text x="582.7278722665741" y="249" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">6,743</text><text x="60" y="323" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">With the vacancies</text><rect x="440" y="289" width="550.0" height="46" fill="#f1521d"/><text x="1004.0" y="323" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">28,810</text></svg>