<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-label="Grouped bars of occupations before and after erosion" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="850" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">How people earn a living</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Share of residents, before erosion and now</text><line x1="60" y1="766" x2="1140" y2="766" stroke="#11261f" stroke-width="2"/><text x="60" y="802" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Rezwana and Islam, household survey of 93 households in Kalikanagar, 2019</text><rect x="60" y="196" width="22" height="22" fill="#57b6ae"/><text x="94" y="215" font-size="20" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Before erosion</text><rect x="311" y="196" width="22" height="22" fill="#f1521d"/><text x="345" y="215" font-size="20" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Now</text><text x="60" y="294" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Fishing on others' boats</text><rect x="490" y="250" width="302.9" height="34" fill="#57b6ae"/><text x="804.9" y="276" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">21%</text><rect x="490" y="292" width="466.8" height="34" fill="#f1521d"/><text x="968.8444444444444" y="318" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">32.3%</text><text x="60" y="398" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Day labour</text><rect x="490" y="354" width="128.1" height="34" fill="#57b6ae"/><text x="630.1222222222223" y="380" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">8.9%</text><rect x="490" y="396" width="233.6" height="34" fill="#f1521d"/><text x="735.5666666666667" y="422" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">16.2%</text><text x="60" y="502" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Small business</text><rect x="490" y="458" width="186.3" height="34" fill="#57b6ae"/><text x="688.3333333333334" y="484" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">12.9%</text><rect x="490" y="500" width="262.6" height="34" fill="#f1521d"/><text x="764.6" y="526" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">18.2%</text><text x="60" y="606" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Farming own land</text><rect x="490" y="562" width="221.3" height="34" fill="#57b6ae"/><text x="723.2888888888889" y="588" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">15.3%</text><rect x="490" y="604" width="14.6" height="34" fill="#f1521d"/><text x="516.588888888889" y="630" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">1%</text><text x="60" y="710" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Farming others' land</text><rect x="490" y="666" width="139.8" height="34" fill="#57b6ae"/><text x="641.8222222222222" y="692" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">9.7%</text><rect x="490" y="708" width="58.4" height="34" fill="#f1521d"/><text x="560.3555555555556" y="734" font-size="21" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">4%</text></svg>