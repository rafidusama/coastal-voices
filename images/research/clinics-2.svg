<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Column chart of visits by season" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="860" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">When patients come</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Share of visits by season</text><line x1="60" y1="776" x2="1140" y2="776" stroke="#11261f" stroke-width="2"/><text x="60" y="812" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Khan, Kamal and Mazumder, patient registers of four community clinics, 2017 and 2018</text><rect x="60.0" y="432.0" width="340.0" height="238.0" fill="#57b6ae"/><text x="60.0" y="418.0" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">25.5%</text><text x="60.0" y="708" font-size="22" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">March to June</text><rect x="430.0" y="343.3" width="340.0" height="326.7" fill="#57b6ae"/><text x="430.0" y="329.3333333333333" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">35%</text><text x="430.0" y="708" font-size="22" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">July to October</text><rect x="800.0" y="301.3" width="340.0" height="368.7" fill="#f1521d"/><text x="800.0" y="287.3333333333333" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">39.5%</text><text x="800.0" y="708" font-size="22" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">November to February</text><line x1="60" y1="670" x2="1140" y2="670" stroke="#11261f" stroke-width="2"/></svg>