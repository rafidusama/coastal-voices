<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 754" width="1200" height="754" role="img" aria-label="Bar chart of changes in water security" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="754" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">What changed for water</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Share of survey respondents, Gaibandha, Barguna and Satkhira</text><line x1="60" y1="670" x2="1140" y2="670" stroke="#11261f" stroke-width="2"/><text x="60" y="706" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Alston, Women and Climate Change in Bangladesh (2015), tables 7.4 and text</text><text x="60" y="249" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Less drinking water available</text><rect x="490" y="215" width="403.1" height="46" fill="#f1521d"/><text x="907.125" y="249" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">64.5%</text><text x="60" y="323" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Salinity in the dry season</text><rect x="490" y="289" width="343.8" height="46" fill="#57b6ae"/><text x="847.75" y="323" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">55%</text><text x="60" y="397" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">More time to collect water</text><rect x="490" y="363" width="287.5" height="46" fill="#57b6ae"/><text x="791.5" y="397" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">46%</text><text x="60" y="471" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Need to find a new source</text><rect x="490" y="437" width="287.5" height="46" fill="#57b6ae"/><text x="791.5" y="471" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">46%</text><text x="60" y="545" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Change in who collects water</text><rect x="490" y="511" width="93.8" height="46" fill="#57b6ae"/><text x="597.75" y="545" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">15%</text><text x="60" y="619" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">More water available</text><rect x="490" y="585" width="46.9" height="46" fill="#57b6ae"/><text x="550.875" y="619" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">7.5%</text></svg>