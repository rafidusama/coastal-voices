acing="0">12</text><rect x="576.0" y="556.2" width="108.0" height="113.8" fill="#f1521d"/><text x="576.0" y="544.1538461538462" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">20</text><text x="456.0" y="708" font-size="22" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Cyclone, 2016</text><rect x="816.0" y="641.5" width="108.0" height="28.5" fill="#57b6ae"/><text x="816.0" y="629.5384615384615" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">5</text><rect x="936.0" y="624.5" width="108.0" height="45.5" fill="#f1521d"/><text x="936.0" y="612.4615384615385" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">8</text><text x="816.0" y="708" font-size="22" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Cyclone, 2017</text><line x1="60" y1="670" x2="1140" y2="670" stroke="#11261f" stroke-width="2"/></svg>