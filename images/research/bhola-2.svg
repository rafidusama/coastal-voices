<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" aria-label="Bar chart of reasons for not evacuating" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="532" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">Why they did not evacuate</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">The 61 who stayed, Cyclone Bulbul 2019</text><line x1="60" y1="448" x2="1140" y2="448" stroke="#11261f" stroke-width="2"/><text x="60" y="484" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Farid and Nasreen, survey of 200 people aged 60 and above, Bhola</text><text x="60" y="249" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Felt safe at home</text><rect x="490" y="215" width="414.3" height="46" fill="#f1521d"/><text x="918.2857142857142" y="249" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">29</text><text x="60" y="323" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Too old to follow the order</text><rect x="490" y="289" width="257.1" height="46" fill="#57b6ae"/><text x="761.1428571428571" y="323" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">18</text><text x="60" y="397" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Family did not take them</text><rect x="490" y="363" width="200.0" height="46" fill="#57b6ae"/><text x="704.0" y="397" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">14</text></svg>