<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 828" width="1200" height="828" role="img" aria-label="Bar chart of share of female patients by condition" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="828" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">Share of patients who were women</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">By condition, 42,905 visits across four clinics</text><line x1="60" y1="744" x2="1140" y2="744" stroke="#11261f" stroke-width="2"/><text x="60" y="780" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Khan, Kamal and Mazumder, patient registers of four community clinics, 2017 and 2018</text><text x="60" y="249" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Anaemia</text><rect x="490" y="215" width="377.0" height="46" fill="#57b6ae"/><text x="881.0" y="249" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">75.4%</text><text x="60" y="323" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Weakness</text><rect x="490" y="289" width="360.5" height="46" fill="#57b6ae"/><text x="864.5" y="323" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">72.1%</text><text x="60" y="397" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Allergy</text><rect x="490" y="363" width="340.0" height="46" fill="#57b6ae"/><text x="844.0" y="397" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">68%</text><text x="60" y="471" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Gastric problems</text><rect x="490" y="437" width="336.5" height="46" fill="#57b6ae"/><text x="840.5" y="471" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">67.3%</text><text x="60" y="545" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Diarrhoea</text><rect x="490" y="511" width="321.5" height="46" fill="#57b6ae"/><text x="825.5" y="545" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">64.3%</text><text x="60" y="619" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">Fever</text><rect x="490" y="585" width="324.0" height="46" fill="#57b6ae"/><text x="828.0" y="619" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">64.8%</text><text x="60" y="693" font-size="23" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">All conditions</text><rect x="490" y="659" width="335.5" height="46" fill="#f1521d"/><text x="839.5" y="693" font-size="24" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">67.1%</text></svg>