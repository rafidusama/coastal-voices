<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Column chart of times families moved" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect width="1200" height="860" fill="#f7f6f1"/><rect x="60" y="56" width="90" height="12" fill="#f1521d"/><text x="60" y="128" font-size="38" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">How many times families moved</text><text x="60" y="170" font-size="22" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Share of surveyed families, Kalikanagar, Bhola</text><line x1="60" y1="776" x2="1140" y2="776" stroke="#11261f" stroke-width="2"/><text x="60" y="812" font-size="17" font-weight="400" fill="#6f817a" text-anchor="start" letter-spacing="0">Source: Rezwana and Islam, household survey of 93 households in Kalikanagar, 2019</text><rect x="60.0" y="334.0" width="340.0" height="336.0" fill="#57b6ae"/><text x="60.0" y="320.0" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">56%</text><text x="60.0" y="708" font-size="22" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">1 to 5 moves</text><rect x="430.0" y="460.0" width="340.0" height="210.0" fill="#57b6ae"/><text x="430.0" y="446.0" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">35%</text><text x="430.0" y="708" font-size="22" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">6 to 10 moves</text><rect x="800.0" y="616.0" width="340.0" height="54.0" fill="#f1521d"/><text x="800.0" y="602.0" font-size="26" font-weight="700" fill="#11261f" text-anchor="start" letter-spacing="0">9%</text><text x="800.0" y="708" font-size="22" font-weight="400" fill="#11261f" text-anchor="start" letter-spacing="0">11 to 15 moves</text><line x1="60" y1="670" x2="1140" y2="670" stroke="#11261f" stroke-width="2"/></svg>